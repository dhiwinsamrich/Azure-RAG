# Golden set for the SYNTHETIC Northwind sample corpus in backend/corpus/.
#
# Chunk ids here are real ids produced by ingesting that corpus, so retrieval
# metrics (hit rate, MRR, citation precision/recall) are meaningful. The
# default evals/golden_set.yaml targets a real MSFT corpus and will score zero
# against Northwind - use this file when testing locally:
#
#   python -m apps.evaluator.cli --golden-set evals/golden_set_local.yaml run
#
# Mix mirrors the recommended one: single-fact, multi-hop, table-dependent and
# unanswerable - including the harder "plausible but absent" refusal.

questions:
  - id: NW-001
    question: What was Northwind's total revenue in fiscal year 2023?
    gold_answer: Total revenue was $211,915 million in fiscal year 2023.
    gold_chunk_ids: ["NORTHWIND-10K-FY23::0001"]
    q_type: single-fact
    answerable: true
    difficulty: easy
    provenance: human
    expected_fiscal_year: 2023
    expected_values: ["$211,915 million"]

  - id: NW-002
    question: How did gross margin change between FY22 and FY23?
    gold_answer: >-
      Gross margin rose from 68.4% in fiscal year 2022 to 69.8% in fiscal year
      2023, an improvement of approximately 140 basis points.
    gold_chunk_ids: ["NORTHWIND-10K-FY23::0001", "NORTHWIND-10K-FY22::0001"]
    q_type: multi-hop
    answerable: true
    difficulty: medium
    provenance: human
    expected_fiscal_year: 2023

  - id: NW-003
