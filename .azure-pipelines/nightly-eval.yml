# Nightly: the full LLM-judge suite over the complete golden set, across every
# retrieval config. Writes the baseline the CI gate compares against.
#
# This is where the judge budget goes, deliberately and once a day. The gate
# stays on free metrics; online sampling stays on the NLI model.

schedules:
  - cron: '0 2 * * *'
    displayName: Nightly evaluation
    branches: { include: [main] }
    always: true

trigger: none
pr: none

variables:
  pythonVersion: '3.12'

jobs:
  - job: FullSuite
    timeoutInMinutes: 120
    pool: { vmImage: 'ubuntu-latest' }
    strategy:
      matrix:
        vectorOnly:     { configId: vector_only }
        bm25Only:       { configId: bm25_only }
        hybridRrf:      { configId: hybrid_rrf }
        hybridSemantic: { configId: hybrid_semantic }
    steps:
      - task: UsePythonVersion@0
        inputs: { versionSpec: $(pythonVersion) }

      - script: pip install -e "./backend[api,azure,eval,dev]"
        displayName: Install

      # Verdicts are content-addressed, so an unchanged config re-runs nearly
      # free. Losing the cache only costs money, never correctness.
      - task: Cache@2
        inputs:
          key: 'judge | "$(Agent.OS)" | backend/evals/golden_set.yaml'
          path: $(Build.SourcesDirectory)/backend/.judge_cache.db
        displayName: Restore judge-verdict cache

      - task: AzureCLI@2
        displayName: Evaluate $(configId)
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: backend
          inlineScript: |
            set -euo pipefail
            python -m apps.evaluator.cli run --config $(configId) --trigger nightly --ragas
        env:
          SEARCH_ENDPOINT: $(searchEndpoint)
          SEARCH_INDEX: $(searchIndexName)
          OPENAI_ENDPOINT: $(openaiEndpoint)
          JUDGE_DEPLOYMENT: $(judgeDeployment)
          DATABASE_URL: $(databaseUrl)

      - script: |
          python -m apps.evaluator.cli compare --metric citation_validity
          python -m apps.evaluator.cli compare --metric context_hit_rate
        workingDirectory: backend
        displayName: Ablation summary
